<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover a fresh mix of posts in the Random feed."
    />
    <title>Random Feed | Social</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }

      .top-bar,
      main {
        width: min(100% - 2rem, 720px);
        margin: 0 auto;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
      }

      .brand {
        margin: 0;
        color: #4f46e5;
        font-size: 1.25rem;
      }

      .tab {
        padding: 0.55rem 0.9rem;
        border: 0;
        border-radius: 999px;
        background: #4f46e5;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }

      main {
        padding: 2rem 0;
      }

      .feed-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .feed-heading h1 {
        margin: 0;
        font-size: 1.75rem;
      }

      #refresh-posts {
        padding: 0.6rem 0.85rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        background: #ffffff;
        color: #374151;
        font: inherit;
        cursor: pointer;
      }

      #refresh-posts:hover {
        background: #f9fafb;
      }

      #feed-status {
        min-height: 1.5rem;
        color: #6b7280;
      }

      #post-list {
        display: grid;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #post-list li {
        padding: 1.25rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        background: #ffffff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
      }

      #post-list h1 {
        margin: 0 0 0.65rem;
        font-size: 1.1rem;
        text-transform: capitalize;
      }

      #post-list p {
        margin: 0;
        color: #4b5563;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="top-bar">
        <p class="brand">Social</p>
        <nav aria-label="Main navigation">
          <button class="tab" type="button" aria-current="page">Random</button>
        </nav>
      </div>
    </header>

    <main>
      <div class="feed-heading">
        <h1>Random posts</h1>
        <button id="refresh-posts" type="button">Shuffle posts</button>
      </div>
      <p id="feed-status" role="status" aria-live="polite">Loading posts...</p>
      <ul id="post-list" aria-label="Random posts"></ul>
    </main>

    <script>
      const postList = document.getElementById("post-list");
      const feedStatus = document.getElementById("feed-status");
      const refreshButton = document.getElementById("refresh-posts");
      let posts = [];

      function displayPosts(postsToDisplay) {
        postList.replaceChildren();

        for (const post of postsToDisplay) {
          const listItem = document.createElement("li");
          const title = document.createElement("h1");
          const body = document.createElement("p");

          title.textContent = post.title;
          body.textContent = post.body;
          listItem.append(title, body);
          postList.append(listItem);
        }
      }

      function shufflePosts(postsToShuffle) {
        const shuffledPosts = [...postsToShuffle];

        for (let index = shuffledPosts.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [shuffledPosts[index], shuffledPosts[randomIndex]] = [
            shuffledPosts[randomIndex],
            shuffledPosts[index],
          ];
        }

        return shuffledPosts;
      }

      async function fetchPosts() {
        feedStatus.textContent = "Loading posts...";

        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts",
          );
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          posts = await response.json();
          displayPosts(shufflePosts(posts));
          feedStatus.textContent = `${posts.length} posts loaded.`;
        } catch (error) {
          feedStatus.textContent =
            "Posts could not be loaded. Check your connection and try again.";
          console.error("Unable to fetch posts:", error);
        }
      }

      refreshButton.addEventListener("click", () => {
        if (posts.length > 0) {
          displayPosts(shufflePosts(posts));
        }
      });

      fetchPosts();
    </script>
  </body>
</html>
